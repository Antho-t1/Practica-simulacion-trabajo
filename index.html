<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Git</title>
</head>

<body>
    <h1>Practica Git</h1>
    <p>Esta es una practica de Git</p>

    <button id="botonMagico">Probar interacción</button>
<p id="mensaje">Presiona el botón para verificar que JavaScript responde.</p>

    <script>
        const boton = document.getElementById('botonMagico');
        const mensaje = document.getElementById('mensaje');

        boton.addEventListener('click', () => {
            mensaje.innerText = "Interacción detectada correctamente desde el botón.";
        });
    </script>
</body>

</html>
