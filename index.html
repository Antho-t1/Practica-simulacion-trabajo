<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Git</title>
</head>

<body>
    <h1>Practica Git</h1>
    <p>Esta es una practica de Git</p>

    <button id="botonMagico">Haz clic aquí</button>
    <p id="mensaje">Esperando interacción...</p>

    <script>
        const boton = document.getElementById('botonMagico');
        const mensaje = document.getElementById('mensaje');

        boton.addEventListener('click', () => {
            mensaje.innerText = "¡JavaScript está funcionando!";
        });
    </script>
</body>

</html>
